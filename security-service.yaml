# Configuración COMÚN a todos los perfiles - security-service
spring:
  application:
    name: security-service
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO

security:
  jwt:
    issuer: ${JWT_ISSUER:logitrack-security}
    private-key-path: ${JWT_PRIVATE_KEY_LOCATION}
    public-key-path: ${JWT_PUBLIC_KEY_LOCATION}
