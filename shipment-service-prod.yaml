# Perfil prod - shipment-service (contenedores: NUNCA localhost entre servicios)
spring:
  datasource:
    # Obligatoria: si falta DB_URL el servicio no arranca (falla rápido y claro)
    url: ${DB_URL}
  jpa:
    show-sql: false

logging:
  level:
    com.logitrack: INFO

courier:
  service:
    # Nombre del servicio en la red de Docker Compose
    url: ${COURIER_SERVICE_URL:http://courier-service:8082}
