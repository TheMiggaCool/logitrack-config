# Configuración COMÚN a todos los perfiles - shipment-service
# Sin secretos: usuario/clave de BD y claves JWT llegan por variables de entorno.
spring:
  application:
    name: shipment-service
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          courier-service:
            connectTimeout: 2000
            readTimeout: 3000

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO

security:
  jwt:
    issuer: ${JWT_ISSUER:logitrack-security}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka-server:8065/eureka/}
  instance:
    prefer-ip-address: true
